[workspace]
resolver = "2"
members = [
    "crates/bids-dataset",
    "crates/bids-core",
    "crates/bids-io",
    "crates/bids-layout",
    "crates/bids-variables",
    "crates/bids-eeg",
    "crates/bids-ieeg",
    "crates/bids-meg",
    "crates/bids-pet",
    "crates/bids-perf",
    "crates/bids-motion",
    "crates/bids-nirs",
    "crates/bids-mrs",
    "crates/bids-micr",
    "crates/bids-beh",
    "crates/bids-nifti",
    "crates/bids-filter",
    "crates/bids-formula",
    "crates/bids-schema",
    "crates/bids-inflect",
    "crates/bids-e2e-tests",
    "crates/pybids-rs",
    "crates/bids-validate",
    "crates/bids-derive",
    "crates/bids-modeling",
    "crates/bids-reports",
    "crates/bids",
    "crates/bids-cli",
]

[workspace.package]
version = "0.0.6"
edition = "2024"
authors = ["Eugene Hauptmann <eugene@hauptmann.me>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/eugenehp/bids-rs"
documentation = "https://docs.rs/bids"
keywords = ["bids", "neuroimaging", "neuroscience", "eeg", "mri"]
categories = ["science", "parser-implementations", "filesystem"]
# edition 2024 requires Rust 1.85.
rust-version = "1.85"

[workspace.lints.clippy]
# Correctness
must_use_candidate = "warn"
# Style
cloned_instead_of_copied = "warn"
redundant_closure_for_method_calls = "warn"
# Suspicious
large_futures = "warn"

[workspace.dependencies]
bids-dataset = { path = "crates/bids-dataset", version = "0.0.6" }
bids-core = { path = "crates/bids-core", version = "0.0.6" }
bids-io = { path = "crates/bids-io", version = "0.0.6" }
bids-layout = { path = "crates/bids-layout", version = "0.0.6" }
bids-variables = { path = "crates/bids-variables", version = "0.0.6" }
bids-eeg = { path = "crates/bids-eeg", version = "0.0.6" }
bids-validate = { path = "crates/bids-validate", version = "0.0.6" }
bids-derive = { path = "crates/bids-derive", version = "0.0.6" }
bids-ieeg = { path = "crates/bids-ieeg", version = "0.0.6" }
bids-meg = { path = "crates/bids-meg", version = "0.0.6" }
bids-pet = { path = "crates/bids-pet", version = "0.0.6" }
bids-perf = { path = "crates/bids-perf", version = "0.0.6" }
bids-motion = { path = "crates/bids-motion", version = "0.0.6" }
bids-nirs = { path = "crates/bids-nirs", version = "0.0.6" }
bids-mrs = { path = "crates/bids-mrs", version = "0.0.6" }
bids-micr = { path = "crates/bids-micr", version = "0.0.6" }
bids-beh = { path = "crates/bids-beh", version = "0.0.6" }
bids-nifti = { path = "crates/bids-nifti", version = "0.0.6" }
bids-filter = { path = "crates/bids-filter", version = "0.0.6" }
bids-formula = { path = "crates/bids-formula", version = "0.0.6" }
bids-schema = { path = "crates/bids-schema", version = "0.0.6" }
bids-inflect = { path = "crates/bids-inflect", version = "0.0.6" }
bids-modeling = { path = "crates/bids-modeling", version = "0.0.6" }
bids-reports = { path = "crates/bids-reports", version = "0.0.6" }

serde = { version = "1", features = ["derive"] }
# float_roundtrip makes JSON float parsing bit-exact. Without it serde_json
# uses a fast approximate parser that can land 1 ULP off, which silently
# perturbs sidecar values such as SliceTiming.
serde_json = { version = "1", features = ["float_roundtrip"] }
regex = "1"
thiserror = "2"
walkdir = "2"
indexmap = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
log = "0.4"

# HTTP / dataset downloading
# https in pure Rust: rustls with webpki's roots, no C compiler (ureq's
# default rustls would build ring's C); the cryptography by feature in the
# crates that fetch: `tls-graviola` (formally verified, x86-64 and aarch64)
# or `tls-rustcrypto` (every target, wasm32 included)
ureq = { version = "3", default-features = false, features = ["json", "gzip", "rustls-no-provider", "rustls-webpki-roots"] }
rustls-graviola = "0.4"
rustls-rustcrypto = "0.1.0-pre.0"
# browser wasm (wasm32-unknown-unknown) has no OS: RustCrypto's randomness
# and rustls's clock come from JS (`crypto.getRandomValues`, `Date.now`)
getrandom = { version = "0.4", features = ["wasm_js"] }
rustls-pki-types = { version = "1", features = ["web"] }
web-time = "1"
# and its https (the browser's XMLHttpRequest and fetch) and disk (OPFS)
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AbortSignal", "Blob", "DedicatedWorkerGlobalScope", "File",
    "FileSystemDirectoryHandle", "FileSystemFileHandle", "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions", "FileSystemHandle", "FileSystemHandleKind",
    "FileSystemRemoveOptions", "FileSystemSyncAccessHandle", "Navigator", "ReadableStream", "ReadableStreamDefaultReader", "RequestCache", "RequestInit",
    "Headers", "Response", "StorageManager", "Window", "WorkerGlobalScope", "WorkerNavigator",
    "XmlHttpRequest", "XmlHttpRequestResponseType",
] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# its tests, in a browser (`tests/browser.rs` in bids-dataset)
wasm-bindgen-test = "0.3"
sha2 = "0.11"

# Optional deps behind feature flags
hdf5 = { package = "hdf5-no-c", version = "0.1.3" }
tiff = "0.11"
fiff = "0.1"
ndarray = "0.17"
arrow = { package = "arrow-array", version = "60" }
arrow-schema = "60"
arrow-csv = "60"
parquet = "60"
memmap2 = "0.9"
safetensors = "0.8"
indicatif = "0.18"
bytemuck = { version = "1", features = ["derive"] }
