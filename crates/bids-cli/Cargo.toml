[package]
name = "bids-cli"
description = "Command-line interface for BIDS datasets"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[[bin]]
name = "bids"
path = "src/main.rs"
# its docs would land on the `bids` library's (same name), and two rustdocs
# writing one directory race; a command line's are `bids --help`
doc = false

[dependencies]
bids = { path = "../bids", version = "0.0.6" }
bids-core = { workspace = true }
bids-layout = { workspace = true }
bids-eeg = { workspace = true }
bids-io = { workspace = true }
bids-modeling = { workspace = true }
bids-reports = { workspace = true }
bids-dataset = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
indicatif = { workspace = true }
regex = { workspace = true }
globset = "0.4"

[lints]
workspace = true
