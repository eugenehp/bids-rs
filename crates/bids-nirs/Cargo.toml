[package]
name = "bids-nirs"
description = "BIDS NIRS domain support — metadata, channels, events; optional SNIRF data reading"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
default = []
## Enable SNIRF (Shared Near Infrared Spectroscopy Format) data reading.
## SNIRF (HDF5) reading, in pure Rust via `hdf5-no-c`: no libhdf5 needed.
snirf = ["dep:hdf5"]

[dependencies]
bids-core = { workspace = true }
bids-io = { workspace = true }
bids-layout = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bids-eeg = { workspace = true }
hdf5 = { workspace = true, optional = true }


[lints]
workspace = true
