[package]
name = "pybids-rs"
description = "Python bindings for bids-rs, a Rust implementation of PyBIDS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
name = "pybids_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module"] }
bids-core = { workspace = true }
bids-layout = { workspace = true }
bids-variables = { workspace = true }
bids-io = { workspace = true }
bids-eeg = { workspace = true }
bids-ieeg = { workspace = true }
bids-meg = { workspace = true }
bids-pet = { workspace = true }
bids-nifti = { workspace = true }
bids-filter = { workspace = true }
bids-formula = { workspace = true }
bids-schema = { workspace = true }
bids-inflect = { workspace = true }
bids-modeling = { workspace = true }
bids-reports = { workspace = true }
serde_json = { workspace = true }
